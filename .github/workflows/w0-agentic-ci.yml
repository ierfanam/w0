name: W0 Agentic CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/w0-agent-runtime.mjs
      - run: node scripts/w0-agent-runtime.mjs . inspect > /tmp/w0-inspect.json
      - run: node -e "const x=require('/tmp/w0-inspect.json'); if(!x.ok) process.exit(1); console.log('W0 runtime inspection passed:',x.fileCount)"

  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/we-dev-next
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/we-dev-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
